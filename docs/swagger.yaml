host: localhost:8080
info:
  contact: {}
  description: Human Resource Management System API
  title: HRMS API
  version: "1.0"
paths:
  /attendance:
    get:
      description: List attendance records for the caller's organisation filtered
        by period. Dates default to current month if not provided.
      parameters:
      - description: Start date (YYYY-MM-DD)
        in: query
        name: start_date
        type: string
      - description: End date (YYYY-MM-DD)
        in: query
        name: end_date
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/hrms_internal_feature_attendance_service.AttendanceResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List attendance records
      tags:
      - Attendance
  /attendance/employees/{employee_id}:
    get:
      description: List attendance records for a specific employee filtered by period
      parameters:
      - description: Employee ID (UUID)
        in: path
        name: employee_id
        required: true
        type: string
      - description: Start date (YYYY-MM-DD)
        in: query
        name: start_date
        type: string
      - description: End date (YYYY-MM-DD)
        in: query
        name: end_date
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/hrms_internal_feature_attendance_service.AttendanceResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List employee attendance
      tags:
      - Attendance
  /attendance/leave-requests:
    get:
      description: List all leave requests in the caller's organisation
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/hrms_internal_feature_attendance_service.LeaveRequestResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List leave requests
      tags:
      - Attendance
    post:
      consumes:
      - application/json
      description: Submit a leave request (sick leave, vacation, remote work, etc.)
      parameters:
      - description: Leave request data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/hrms_internal_feature_attendance_service.CreateLeaveRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/hrms_internal_feature_attendance_service.CreateLeaveResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "422":
          description: Unprocessable Entity
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Submit leave request
      tags:
      - Attendance
  /attendance/leave-requests/{id}:
    get:
      description: Retrieve details of a specific leave request
      parameters:
      - description: Leave Request ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/hrms_internal_feature_attendance_service.LeaveRequestResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get leave request
      tags:
      - Attendance
  /attendance/leave-requests/{id}/review:
    patch:
      consumes:
      - application/json
      description: HR or manager approves or rejects a leave request
      parameters:
      - description: Leave Request ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: Action (approve|reject)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/hrms_internal_feature_attendance_service.ReviewLeaveRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Approve or reject leave request
      tags:
      - Attendance
  /attendance/skud-events:
    post:
      consumes:
      - application/json
      description: Accept an entry/exit event from the access control system (СКУД).
        Automatically creates or updates the attendance record for the day.
      parameters:
      - description: SKUD event
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/hrms_internal_feature_attendance_service.CreateSkudEventRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/hrms_internal_feature_attendance_service.CreateSkudEventResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "422":
          description: Unprocessable Entity
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Register SKUD event
      tags:
      - Attendance
  /attendance/work-schedules:
    post:
      consumes:
      - application/json
      description: Create or update the flexible work schedule for an employee
      parameters:
      - description: Schedule data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/hrms_internal_feature_attendance_service.SetWorkScheduleRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "422":
          description: Unprocessable Entity
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Set work schedule
      tags:
      - Attendance
  /attendance/work-schedules/{employee_id}:
    get:
      description: Retrieve the work schedule for a specific employee
      parameters:
      - description: Employee ID (UUID)
        in: path
        name: employee_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/hrms_internal_feature_attendance_service.WorkScheduleResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get work schedule
      tags:
      - Attendance
  /auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Sends a password reset code to the user's email
      parameters:
      - description: Email address
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/hrms_internal_feature_auth_service.ForgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "422":
          description: Unprocessable Entity
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Forgot password
      tags:
      - Auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate with email and password, returns JWT tokens
      parameters:
      - description: Credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/hrms_internal_feature_auth_service.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/hrms_internal_feature_auth_service.TokenResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Login
      tags:
      - Auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Revokes the refresh token and deletes the session
      parameters:
      - description: Refresh token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/hrms_internal_feature_auth_service.LogoutRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
