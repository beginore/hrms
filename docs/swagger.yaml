  /auth/reset-password:
    post:
      consumes:
      - application/json
      description: Confirms the password reset using the code sent to the user's email
      parameters:
      - description: Reset details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/hrms_internal_feature_auth_service.ResetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
