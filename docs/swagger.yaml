        "422":
          description: Unprocessable Entity
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Reset password
      tags:
      - Auth
  /calendar:
    post:
      consumes:
      - application/json
      description: Mark a date as a holiday (HOLIDAY) or override a weekend as a working
        day (WORKDAY)
      parameters:
      - description: Day data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/hrms_internal_feature_calendar_service.AddCalendarDayRequest'
      produces:
      - application/json
