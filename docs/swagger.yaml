  hrms_internal_feature_consent_service.ConsentValidationError:
    properties:
      currentVersion:
        type: string
      documentType:
        type: string
      latestVersion:
        type: string
    required:
    - documentType
    type: object
  hrms_internal_feature_consent_service.ConsentValidationResponse:
    properties:
      errors:
        items:
          $ref: '#/definitions/hrms_internal_feature_consent_service.ConsentValidationError'
        type: array
      valid:
        type: boolean
    type: object
  hrms_internal_feature_consent_service.RenewConsentRequest:
