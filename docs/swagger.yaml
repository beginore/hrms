            type: object
        "422":
          description: Unprocessable Entity
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Reset password
      tags:
      - Auth
  /employees:
    get:
      description: Retrieve all employees belonging to the caller's organisation
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/hrms_internal_feature_employee_service.EmployeeResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List employees
      tags:
      - Employees
    post:
      consumes:
      - application/json
      description: Add a new employee record for the caller's organisation
      parameters:
      - description: Employee data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/hrms_internal_feature_employee_service.CreateEmployeeRequest'
      produces:
