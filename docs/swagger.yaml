    type: object
  hrms_internal_feature_calendar_service.MonthSummaryResponse:
    properties:
      days:
        items:
          $ref: '#/definitions/hrms_internal_feature_calendar_service.DaySummary'
        type: array
      holidays:
        type: integer
      month:
        type: integer
      total_days:
        type: integer
      weekends:
        type: integer
      workday_overrides:
        type: integer
      working_days:
        type: integer
      year:
        type: integer
    type: object
  hrms_internal_feature_city_service.CityResponse:
