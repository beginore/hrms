    properties:
      document_url:
        type: string
      employee_id:
        type: string
      end_date:
        description: YYYY-MM-DD
        type: string
      reason:
        type: string
      start_date:
        description: YYYY-MM-DD
        type: string
      type:
        description: SICK_LEAVE | VACATION | REMOTE | BUSINESS_TRIP | UNPAID_LEAVE
        type: string
    required:
    - employee_id
    - end_date
    - start_date
    - type
    type: object
  hrms_internal_feature_attendance_service.CreateLeaveResponse:
    properties:
      leave_request_id:
        type: string
    type: object
  hrms_internal_feature_attendance_service.CreateSkudEventRequest:
    properties:
      device_id:
        type: string
      employee_id:
        type: string
      event_type:
        description: ENTER | EXIT
        type: string
      occurred_at:
        description: RFC3339; empty = now
        type: string
    required:
    - employee_id
    - event_type
    type: object
  hrms_internal_feature_attendance_service.CreateSkudEventResponse:
    properties:
      message:
        type: string
    type: object
  hrms_internal_feature_attendance_service.LeaveRequestResponse:
    properties:
      created_at:
        type: string
      document_url:
        type: string
      employee_id:
        type: string
      end_date:
        type: string
      id:
        type: string
      reason:
        type: string
      reviewed_at:
        type: string
      reviewed_by:
        type: string
      start_date:
        type: string
      status:
        type: string
      type:
        type: string
    type: object
  hrms_internal_feature_attendance_service.ReviewLeaveRequest:
    properties:
      action:
        description: approve | reject
        type: string
    required:
    - action
    type: object
  hrms_internal_feature_attendance_service.SetWorkScheduleRequest:
    properties:
      employee_id:
        type: string
      late_threshold_minutes:
        description: default 15
        type: integer
      work_end:
        description: '"18:00"'
        type: string
      work_start:
        description: '"09:00"'
        type: string
    required:
    - employee_id
    - work_end
    - work_start
    type: object
  hrms_internal_feature_attendance_service.WorkScheduleResponse:
    properties:
      employee_id:
        type: string
      late_threshold_minutes:
        type: integer
      work_end:
        type: string
      work_start:
        type: string
    type: object
  hrms_internal_feature_auth_service.ForgotPasswordRequest:
    properties:
      email:
        type: string
    type: object
  hrms_internal_feature_auth_service.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  hrms_internal_feature_auth_service.LogoutRequest:
    properties:
      refreshToken:
        type: string
    type: object
  hrms_internal_feature_auth_service.RefreshTokenRequest:
    properties:
      refreshToken:
        type: string
    type: object
  hrms_internal_feature_auth_service.ResetPasswordRequest:
    properties:
      code:
        type: string
      email:
        type: string
      newPassword:
        type: string
    type: object
  hrms_internal_feature_auth_service.TokenResponse:
    properties:
      accessToken:
        type: string
      expiresIn:
        type: integer
      idToken:
        type: string
      refreshToken:
        type: string
      tokenType:
        type: string
    type: object
  hrms_internal_feature_calendar_service.AddCalendarDayRequest:
    properties:
      date:
        description: YYYY-MM-DD
        type: string
      name:
        description: '"Наурыз", "День Независимости", etc.'
        type: string
      type:
        description: HOLIDAY | WORKDAY
        type: string
    required:
